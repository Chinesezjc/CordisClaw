[package]
name = "cordis-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
cordis-runtime = { path = "../cordis-runtime" }
cordis-plugin-sdk = { path = "../cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
ctor = "0.2"
cordis-tooling = { path = "../cordis-tooling" }
serial_test = "3"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
serde_yaml = "0.9"
