name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CARGO_TERM_COLOR 无需任何约定：dtolnay/rust-toolchain 在该 env 未设置时
# 会自动向 GITHUB_ENV 注入 always（因此在这里删除或不设都拦不住着色）。
# runtime 内部嵌套 cargo 的 warning 检测已在入口剥离 ANSI 转义序列
# （host.rs strip_ansi_sequences），对着色输出免疫。

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # CI 每次都在 rust-cache 的干净状态上重建，增量编译目录（`target/debug/
    # incremental`，本地实测单棵树 4G 级）只会在缓存里白占体积、拖慢恢复，
    # 不会命中上一次的中间结果。这里显式关掉，与本地开发（保留增量）分开。
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      # 契约的静态门禁：插件 dylib 能被 unload 的前提是「所有跨 invoke 存活
      # 的线程都走 ServiceThreads::spawn」。`allow_plugin_unload!()` 只是作者
      # 声明，runtime 无法验证——裸 `std::thread::spawn` 不在注册表里，live==0
      # 就是假证据（`qq::qq_serve` SIGSEGV 类的成因）。这里用源码扫描把它变成
      # CI 事实：`fixtures/plugins/*/src/**/*.rs` 里 `#[cfg(test)]` 之外出现
      # 裸 spawn 即失败，短命线程必须用带非空理由的
      # `// cordis:allow-raw-thread: <理由>` 显式豁免。脚本与样例测试都只依赖
      # Python 标准库，所以放在 toolchain 之前，最快失败。
      # 注意这只覆盖插件源码的一半：依赖里自带的线程（tiny_http 的 accept/
      # TaskPool、reqwest 的 blocking runtime）扫描不到，所以
      # `allow_plugin_unload!()` 的前提是「含依赖在内没有不可见线程」——qq/feishu
      # 的 webhook 已改成自持 TcpListener 并移除 tiny_http 生产依赖。
      - name: raw-thread contract
        run: |
          python3 scripts/test_check_raw_threads.py
          python3 scripts/check_raw_threads.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # fixtures/plugins 是独立 workspace：集成测试首次运行时会在
      # CI 上现场 cargo build 各 fixture 插件（fixtures/artifacts/
      # 不入库），因此其 target 目录也要缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fixtures/plugins

      - name: rustfmt
        run: cargo fmt --all --check

      # `--workspace` 是 clippy 门禁必须的：`cordis-agent` 不在
      # default-members 里（它是 `cordis-cli` 的依赖，不是默认构建目标），
      # 只跑 default-members 时它的 lib/test/integration 目标完全不会被
      # 编译检查——一个 `clippy::items_after_test_module` 和整片 unused
      # import 就这样在门禁外活了下来。coverage workflow 早就用
      # `--workspace` 跑，这里对齐。
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --all-targets --locked

      # fixtures/artifacts/ 不入库；host.rs / verifier.rs 的 lib 单测直接
      # RuntimeHost::boot，不走集成测试 support::fixtures_root() 的
      # ensure_fixture_artifacts()，所以必须在 test 之前显式预构建。
      # prepare-artifacts 内部对 fixtures/plugins 跑 `cargo metadata
      # --offline`（tooling.rs 对 metadata 子命令强制 offline），冷 runner
      # 的 registry 没有 fixtures 依赖包时报 "no matching package named
      # `hmac` found"。先在线 fetch 填充 registry；rust-cache 会缓存。
      - name: fetch fixtures/plugins dependencies
        run: cargo fetch --manifest-path fixtures/plugins/Cargo.toml

      # 失败时把输出尾部写成 ::error:: 注解，便于从 check-runs API 读取
      # 失败原因（GitHub 的原始日志接口需要认证）。
      - name: prepare fixture artifacts
        run: |
          set -o pipefail
          cargo run --locked -p cordis-cli -- prepare-artifacts fixtures 2>&1 | tee /tmp/prepare.log || {
            echo "::error::$(grep -m1 'prepare-artifacts failed' /tmp/prepare.log | head -c 900)"
            echo "::error::context: $(grep -B2 -m1 'prepare-artifacts failed' /tmp/prepare.log | tr '\n' ' ' | head -c 900)"
            exit 1
          }

      # 并行执行：boot 的 stale snapshot 清理已按目录名中的 pid 探活
      # （host.rs cleanup_stale_snapshot_dirs），共享 snapshot root 的
      # 并行测试不再互删 in-flight staging。mock LLM server 的 accept
      # 超时在 CI 下放宽（tests/support/mod.rs mock_llm_accept_timeout）。
      - name: test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee /tmp/test.log || {
            echo "::error::failed tests: $(grep -E '^test .* FAILED' /tmp/test.log | head -c 600 | tr '\n' ' ')"
            echo "::error::first panic: $(grep -m1 -A2 'panicked at' /tmp/test.log | tr '\n' ' ' | head -c 900)"
            exit 1
          }

      # fixtures 的测试此前完全不在门禁里：12 个 workspace member、10 个 expr
      # 子 crate（在 fixtures workspace 的 `exclude` 里、各自独立 manifest）、
      # 以及 root 占位 crate。`expr/lexer` 里一条从 HEAD 起就红的断言因此一直
      # 活到 5.2.53（那里把合法标识符 `1 + a` 当成词法错误）。
      # 放在 prepare-artifacts 之后：插件已构建，跑测试基本只是热身（实测 ~2s）。
      - name: fixtures tests
        run: |
          set -o pipefail
          bash scripts/test-fixtures.sh 2>&1 | tee /tmp/fixtures-test.log || {
            echo "::error::failed fixtures tests: $(grep -E '^test .* FAILED' /tmp/fixtures-test.log | head -c 600 | tr '\n' ' ')"
            echo "::error::first panic: $(grep -m1 -A2 'panicked at' /tmp/fixtures-test.log | tr '\n' ' ' | head -c 900)"
            exit 1
          }
