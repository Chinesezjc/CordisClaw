name: coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    # 插桩后的串行全量测试比普通 CI 慢，放宽超时。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fixtures/plugins

      - name: fetch fixtures/plugins dependencies
        run: cargo fetch --manifest-path fixtures/plugins/Cargo.toml

      - name: prepare fixture artifacts
        run: cargo run --locked -p cordis-runtime -- prepare-artifacts fixtures

      # 覆盖率门槛：行覆盖 >= 96%（当前基线 96.8%，余量吸收平台差异）。
      # 排除 main.rs（REPL/signal/exit）与 agent.rs（LLM 流式 I/O）——
      # 均为进程/网络边界，见 CLAUDE.md 覆盖率规范。
      # 串行执行：插桩下 host 系集成测试共享 fixtures 工件，并行会因
      # 中途重建 dylib 触发 HashMismatch 假失败。
      - name: run tests with coverage (96% line gate)
        run: |
          cargo llvm-cov --locked --workspace \
            --fail-under-lines 96 \
            --ignore-filename-regex 'cordis-runtime/src/(main|agent)\.rs' \
            --lcov --output-path lcov.info \
            -- --test-threads=1

      - name: coverage summary
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 30
