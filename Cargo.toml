[workspace]
members = [
  "crates/cordis-cli",
  "crates/cordis-plugin-host",
  "crates/cordis-plugin-sdk",
  "crates/cordis-runtime",
  "crates/cordis-tooling",
]
# The CLI crate is a default member on purpose: `cargo build` must keep
# producing `target/debug/cordis-runtime` (systemd / ops scripts invoke it by
# that path) even though the binary now lives in its own package.
default-members = [
  "crates/cordis-cli",
  "crates/cordis-plugin-host",
  "crates/cordis-plugin-sdk",
  "crates/cordis-runtime",
  "crates/cordis-tooling",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["CordisClaw"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
libloading = "0.8"
