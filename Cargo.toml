[workspace]
members = [
    "crates/cordis-agent",
  "crates/cordis-cli",
  "crates/cordis-plugin-host",
  "crates/cordis-plugin-sdk",
  "crates/cordis-runtime",
  "crates/cordis-tooling",
]
# The CLI crate is a default member on purpose: `cargo build` must keep
# producing `target/debug/cordis-runtime` (systemd / ops scripts invoke it by
# that path) even though the binary now lives in its own package.
default-members = [
  "crates/cordis-cli",
  "crates/cordis-plugin-host",
  "crates/cordis-plugin-sdk",
  "crates/cordis-runtime",
  "crates/cordis-tooling",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["CordisClaw"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
libloading = "0.8"

# 体积治理（2026-11-18）：dev profile 默认带完整 debuginfo，实测单个集成测试
# 二进制 193M、`libcordis_runtime.rlib` 112M、`target/` 单次全量构建就到 9G。
# 本仓的硬门禁只需要**行**覆盖，行表（.debug_line）就足够 llvm-cov 做映射，
# 变量/类型信息纯属体积负担。改成 `line-tables-only` 后仍能定位到行，只是调试
# 时看不到局部变量值——需要逐变量调试时用环境变量临时覆盖：
#   CARGO_PROFILE_DEV_DEBUG=2 cargo build
[profile.dev]
debug = "line-tables-only"
