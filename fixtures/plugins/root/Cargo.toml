[package]
name = "root"
version = "0.1.0"
edition = "2021"

[package.metadata.cordis]
plugin_path = "root"
abi_kind = "rust"
declared_nodes = ["root_entry"]
# P2-10: `./child` was previously declared as a required child plugin, but
# the `fixtures/plugins/root/child/` directory no longer exists in the
# tree. Empty out `children` so `PackageResolver` doesn't error on a
# missing dependency. If a nested root/child fixture is needed again,
# reintroduce both the directory scaffold and this declaration.
children = []

[package.metadata.cordis.abi_fingerprint]
rustc_version = "1.85.1"
target_triple = "x86_64-unknown-linux-gnu"
crate_hash = "crate_root_v1"
api_hash = "api_v2"

[package.metadata.cordis.artifact]
exports = ["service.db", "service.cache"]
