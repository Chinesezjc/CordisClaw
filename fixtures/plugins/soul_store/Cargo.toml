[package]
name = "soul_store"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "soul_store"
abi_kind = "rust"
declared_nodes = ["soul_get", "soul_set"]

[package.metadata.cordis.abi_fingerprint]
rustc_version = "1.85.1"
target_triple = "x86_64-unknown-linux-gnu"
crate_hash = "crate_soul_store_v1"
api_hash = "api_v2"

[build-dependencies]
serde_json = "1"

[dependencies]
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled: compile SQLite from source so the cdylib has zero system deps.
rusqlite = { version = "0.31", features = ["bundled"] }
