[profile.dev]
strip = "symbols"

[workspace]
exclude = [
    "_net",
    # The scaffold placeholder is built and tested as its own manifest (see
    # scripts/test-fixtures.sh); it is not a runtime-loadable plugin.
    "root",
    "expr/lexer",
    "expr/parser",
    "expr/evaluator",
    "expr/evaluator/add",
    "expr/evaluator/sub",
    "expr/evaluator/mul",
    "expr/evaluator/div",
    "expr/evaluator/pow",
    "expr/evaluator/modulo",
    "expr/evaluator/factorial",
]
members = [
    "time",
    "filesystem",
    "expr",
    "shell",
    "qq",
    "feishu",
    "web",
    "git",
    "vision",
    "gacha",
    "soul_store",
    "llm_openai",
]
resolver = "2"
