[workspace]
members = [
  "time",
  "filesystem", "expr", "shell", "qq", "feishu", "web", "git", "vision", "gacha"]
exclude = [
  # `_net` is a utility rlib shared by `web` and `vision` for the SSRF
  # guard (P2-2); it's not a runtime-loadable plugin. Depended on via
  # `path = "../_net"` inside those crates.
  "_net",
  "expr/lexer",
  "expr/parser",
  "expr/evaluator",
  "expr/evaluator/add",
  "expr/evaluator/sub",
  "expr/evaluator/mul",
  "expr/evaluator/div",
  "expr/evaluator/pow",
  "expr/evaluator/modulo",
  "expr/evaluator/factorial",
]
resolver = "2"

[profile.dev]
strip = "debuginfo"
