[package]
name = "feishu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "feishu"
abi_kind = "rust"
declared_nodes = ["feishu_serve", "feishu_send", "feishu_entry"]
children = []
# Docs come from the built dylib's docs_value(); no hand-written
# docs/agent/interfaces.json (P1-48 opt-in).
allow_generated_docs = true

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_feishu_v1"
api_hash = "api_v2"

[build-dependencies]
serde_json = "1"

[dependencies]
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# TLS feature is required — unlike qq (which only talks to a local OneBot
# over http), feishu sends HTTPS to open.feishu.cn.
ureq = { version = "2", features = ["tls", "json"] }
# Event-subscription encryption (Encrypt Key mode): AES-256-CBC.
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
base64 = "0.22"
# Long-connection (wss) event mode: sync WebSocket client.
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
