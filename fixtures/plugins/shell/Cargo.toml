[package]
name = "shell"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "shell"
abi_kind = "rust"
declared_nodes = ["shell_entry"]
children = []

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_shell_v1"
api_hash = "api_v2"

[dependencies]
cordis-plugin-host = { path = "../../../crates/cordis-plugin-host" }
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
