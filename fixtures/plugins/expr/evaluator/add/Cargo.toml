[package]
name = "expr_evaluator_add"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "expr/evaluator/add"
abi_kind = "rust"
declared_nodes = ["expr_add"]
children = []

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_expr_add_v1"
api_hash = "api_v2"

[dependencies]
cordis-plugin-sdk = { path = "../../../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]

# 本 crate 末尾的空 [workspace] 使它成为独立 workspace 根，因此
# fixtures/plugins/Cargo.toml 的 [profile.dev] 够不着它（它在那份清单的
# exclude 列表里）。不在这里重复一份，产出的 .so 就会带上完整调试信息与
# 符号表——实测每个约 9 MB，其中 5.9 MB 是调试段。
[profile.dev]
strip = "symbols"
