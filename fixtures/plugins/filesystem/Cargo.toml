[package]
name = "filesystem"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "filesystem"
abi_kind = "rust"
declared_nodes = ["fs_read", "fs_write", "fs_list", "fs_search"]
children = []

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_filesystem_v1"
api_hash = "api_v2"

[dependencies]
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
