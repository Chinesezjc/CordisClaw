[package]
name = "qq"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "qq"
abi_kind = "rust"
declared_nodes = ["qq_entry", "qq_serve", "qq_ws_serve", "qq_fetch_messages", "qq_send", "qq_get_group_members", "qq_get_group_info", "qq_system_notify"]
children = []

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_qq_v1"
api_hash = "api_v2"

[build-dependencies]
serde_json = "1"

[dependencies]
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tungstenite = "0.26"
ureq = "2"
# P0-23: HMAC-SHA1 for OneBot v11 X-Signature webhook verification.
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
