[package]
name = "git"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[package.metadata.cordis]
plugin_path = "git"
abi_kind = "rust"
declared_nodes = ["git_diff", "git_log", "git_status", "git_commit", "git_reset", "git_rebase", "git_amend", "git_cherry_pick"]
children = []

[package.metadata.cordis.abi_fingerprint]
crate_hash = "crate_git_v1"
api_hash = "api_v2"

[dependencies]
cordis-plugin-sdk = { path = "../../../crates/cordis-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
